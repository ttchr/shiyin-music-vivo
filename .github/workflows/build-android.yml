name: Build Android APK

# 仅构建 Android 64 位 ARM64 + Impeller；不生成 Skia、32 位或其它客户端。
# 仅在推送 v* tag 或手动触发时执行。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'
  JAVA_VERSION: '17'
  NDK_VERSION: '28.2.13676358'
  CUSTOM_PACKAGE_NAME: 'com.apple.android.music'

jobs:
  build-apk:
    name: Build Android ARM64 Impeller APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: android-arm64
          save-if: ${{ github.event_name != 'pull_request' }}

      # 正式 Release 必须使用仓库 Secrets 中的发布证书；不再静默回退 Debug 签名。
      - name: Prepare and verify release signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Release signing secrets are incomplete. Configure RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore

          keytool -list \
            -keystore android/app/release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            > /dev/null

          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > android/key.properties

          echo "Release keystore decoded and alias verified."

      - name: Build Android 64-bit Impeller APK
        run: >-
          flutter build apk --release
          --target-platform android-arm64
          --flavor impeller
          --android-project-arg=customPackageName=${{ env.CUSTOM_PACKAGE_NAME }}
          --dart-define=APP_RENDERER=impeller
          --dart-define=APP_ABI=arm64

      - name: Rename APK and verify package configuration
        id: apk
        run: |
          set -euo pipefail
          SRC="build/app/outputs/flutter-apk/app-impeller-release.apk"
          test -f "$SRC" || { echo "::error::APK not found: $SRC"; exit 1; }
          DST="shiyin-${{ github.ref_name }}-impeller-arm64.apk"
          cp "$SRC" "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"
          ls -lh "$DST"

          # 校验 Gradle -PcustomPackageName 参数确实生效，防止静默打出默认包名。
          actual_app_id=$(apkanalyzer manifest application-id "$DST")
          if [ "$actual_app_id" != "$CUSTOM_PACKAGE_NAME" ]; then
            echo "::error::包名不匹配：期望=$CUSTOM_PACKAGE_NAME 实际=$actual_app_id"
            exit 1
          fi
          echo "Verified applicationId: $actual_app_id"

          # 版本一致性守卫（仅 tag 为 x.y.z 时校验）。
          if [[ "${{ github.ref_name }}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            tag_ver="${BASH_REMATCH[1]}"
            pub_ver=$(grep -m1 -E '^version:' pubspec.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            if [ -z "$pub_ver" ] || [ "$pub_ver" != "$tag_ver" ]; then
              echo "::error::tag 与 pubspec.yaml 版本不一致：tag=$tag_ver pubspec=$pub_ver"
              exit 1
            fi
          fi

          # APK 必须只包含 ARM64 原生库。
          if ! unzip -l "$DST" | grep -q 'lib/arm64-v8a/'; then
            echo "::error::APK 中缺少 arm64-v8a 原生库"
            exit 1
          fi
          if unzip -l "$DST" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "::error::APK 意外包含非 ARM64 ABI"
            exit 1
          fi

      - name: Generate SHA256 sidecar
        run: sha256sum "${{ steps.apk.outputs.path }}" > "${{ steps.apk.outputs.path }}.sha256"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-impeller-${{ github.ref_name }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          if-no-files-found: error

      # 只把 Android ARM64 Impeller APK 附加到已存在的草稿 Release。
      - name: Upload APK to draft Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" \
            "${{ steps.apk.outputs.path }}" \
            "${{ steps.apk.outputs.path }}.sha256" \
            -R "$GITHUB_REPOSITORY" --clobber
